        stroke="#c8a830" stroke-width="31" fill="none" stroke-linecap="round" opacity="0.22"/>
  <path d="M -5,457 C 90,453 200,460 360,455 C 520,450 628,458 725,454"
        stroke="#f5e07c" stroke-width="28" fill="none" stroke-linecap="round"/>
