        stroke="#f5e07c" stroke-width="17" fill="none" stroke-linecap="round"/>

  <!-- ── 東側南北道路（x≈468）── -->
  <path d="M 469,-5 C 467,90 466,180 468,270 C 470,360 468,448 469,595"
        stroke="#f5e07c" stroke-width="17" fill="none" stroke-linecap="round"/>

