  <path d="M 162,233 C 218,230 278,234 345,231 C 412,228 452,232 560,229"
        stroke="#f8ec9e" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- ── 東西横断路２（y≈358）── -->
