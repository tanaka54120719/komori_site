<svg viewBox="0 0 720 590" xmlns="http://www.w3.org/2000/svg"
     font-family="'Hiragino Maru Gothic ProN','BIZ UDPGothic','Meiryo',sans-serif">
<defs>
  <!-- 手書き風ゆらぎフィルタ -->
  <filter id="hd" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- ドロップシャドウ（病院用） -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1.5" dy="2.5" stdDeviation="4" flood-color="#c0394a" flood-opacity="0.22"/>
  </filter>
  <!-- 薄いシャドウ（ランドマーク用） -->
  <filter id="lshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="1.5" stdDeviation="2.5" flood-color="#888" flood-opacity="0.18"/>
  </filter>
</defs>

<!-- ══════════════════════════════════
     背景
══════════════════════════════════ -->
<rect width="720" height="590" fill="#fef8f0" rx="0"/>

<!-- 薄い格子（紙のテクスチャ風） -->
<g opacity="0.18" stroke="#d8c8b8" stroke-width="0.4">
  <line x1="0" y1="80" x2="720" y2="80"/>
  <line x1="0" y1="160" x2="720" y2="160"/>
  <line x1="0" y1="240" x2="720" y2="240"/>
  <line x1="0" y1="320" x2="720" y2="320"/>
  <line x1="0" y1="400" x2="720" y2="400"/>
