  <line x1="240" y1="0" x2="240" y2="590"/>
  <line x1="360" y1="0" x2="360" y2="590"/>
  <line x1="480" y1="0" x2="480" y2="590"/>
  <line x1="600" y1="0" x2="600" y2="590"/>
</g>

